name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:cov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  sonar:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # SonarQube éphémère lancé dans la pipeline (pas besoin de ngrok ni de secrets)
    services:
      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    env:
      SONAR_HOST_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: Wait for SonarQube
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s "$SONAR_HOST_URL/api/system/status" | grep -o '"status":"[A-Z]*"' || true)
            echo "$status"
            [ "$status" = '"status":"UP"' ] && exit 0
            sleep 5
          done
          exit 1
      - name: Create project, token and Quality Gate
        run: |
          curl -sf -u admin:admin -X POST "$SONAR_HOST_URL/api/users/change_password" \
            -d login=admin -d previousPassword=admin -d password=CiAdmin-Passw0rd!
          curl -sf -u admin:CiAdmin-Passw0rd! -X POST "$SONAR_HOST_URL/api/projects/create" \
            -d project=node-quality-tp -d name='Node Quality TP' -d mainBranch=main
          token=$(curl -sf -u admin:CiAdmin-Passw0rd! -X POST "$SONAR_HOST_URL/api/user_tokens/generate" \
            -d name=ci | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Apply CESI Quality Gate
        run: bash scripts/create_quality_gate.sh node-quality-tp "CESI - NodeJS TP Gate"
      - name: SonarQube scan (Quality Gate bloquant)
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL -e SONAR_TOKEN \
            -v "${{ github.workspace }}:/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
